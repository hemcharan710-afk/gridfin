[project]
name = "gridfin"
version = "0.1.0"
description = "Grid-based analysis of financial documents: answer cross-document questions cell by cell, with deterministic math."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hemcharan Varma" }]

# Core dependencies are kept light so the project runs offline on the bundled demo
# dataset with no GPU or model downloads.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "duckdb>=0.10",
    "rank-bm25>=0.2.2",
    "tenacity>=8.2",
    "anthropic>=0.39",
    "openai>=1.30",
    "diskcache>=5.6",
]

[project.optional-dependencies]
# Real ML backends (embeddings + ANN). Install with: pip install -e ".[ml]"
ml = [
    "sentence-transformers>=2.7",   # BGE embeddings
    "faiss-cpu>=1.8",               # dense ANN index
    "torch>=2.2",
]
# Document ingestion for real PDFs / Word docs (the demo dataset needs none of this).
ingest = [
    "pdfplumber>=0.11",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
# Interactive grid UI.
ui = [
    "streamlit>=1.36",
    "streamlit-aggrid>=1.0.5",
]
# Evaluation harness.
eval = [
    "ragas>=0.1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
gridfin = "gridfin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridfin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
